[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "onnxsim"
dynamic = ["version"]
description = "Simplify your ONNX model"
readme = "README.md"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
requires-python = ">=3.10"
dependencies = [
    "onnx",
    "rich",
]
authors = [
    {name = "ONNX Simplifier Authors", email = "daquexian566@gmail.com"},
]
keywords = ["deep-learning", "ONNX"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]

[project.optional-dependencies]
# onnxruntime is preferred for constant folding and correctness checking.
# When it is not installed, onnxsim falls back to onnx's reference evaluator.
onnxruntime = ["onnxruntime >= 1.6.0"]
# sympy lets the MACs/FLOPs report keep dynamic dimensions (dim_param, e.g.
# "batch") as symbols and produce a formula instead of assuming them to be 1.
symbolic = ["sympy"]

[project.urls]
Homepage = "https://github.com/onnxsim/onnxsim"

[project.scripts]
onnxsim = "onnxsim:main"

[tool.pytest.ini_options]
# Always report the 10 slowest tests. tests/conftest.py additionally mirrors
# this list into the GitHub Actions job summary when running in CI, so the
# timings are visible without opening the raw logs.
addopts = "--durations=10"

[tool.ruff]
# The vendored single-header option parser is not our code to reformat.
extend-exclude = ["onnxsim/cxxopts.hpp"]

[tool.ruff.lint]
# pycodestyle errors (E), Pyflakes (F), and isort (I). Import sorting is applied
# by `ruff check --fix`; `ruff format` handles the rest of the layout.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# Type-check the Python package (not the tests, which lean on dynamic fixtures).
files = ["onnxsim"]
python_version = "3.10"
# onnx/numpy/onnxruntime/torch expose partial or no type information, the
# compiled `onnxsim_cpp2py_export` extension has no stubs, and upstream stubs
# are incomplete (e.g. onnx OpSchema methods). Treat every third-party import as
# Any so the check covers our own code and stays stable across dependency bumps.
# The Lint workflow deliberately runs mypy without these packages installed.
ignore_missing_imports = true
