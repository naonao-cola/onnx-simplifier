# Publishes the `onnxsim` npm package (npm/onnxsim/): onnxsim compiled to
# WebAssembly with constant folding delegated to onnxruntime-web instead of a
# compiled-in ONNX Runtime (see docs/wasm_ort_web.md and
# npm/onnxsim/README.md). Loosely mirrors the PyPI release job in
# build-and-test.yml (build the artifact, act only on a `v*` tag release,
# OIDC trusted publishing so no long-lived npm token is stored as a secret),
# but the `publish` job below only *stages* the release --
# https://docs.npmjs.com/staged-publishing -- so a maintainer's 2FA approval
# is still required before it goes live; see that job's comments.
name: Publish npm package

on:
  release:
    types: [published]
  # Lets a maintainer re-run publishing for an existing release (e.g. after
  # fixing a packaging bug) without cutting a new tag.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/npm-publish.yml"
      - "npm/onnxsim/**"
      - "scripts/build_npm_package.sh"
      - "scripts/stage_npm_package.sh"
      - "scripts/convertmodel/ort_executor.mjs"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"

jobs:
  # static.yml (the convertmodel demo) builds this exact ORT-web module on
  # every push to master/pages and on `/preview`, matched here by head SHA.
  # Reusing that artifact skips a ~20 minute emscripten build; only build from
  # source when no matching run is found (e.g. a branch static.yml hasn't
  # built yet, or path filters skipped it there). Built once here and shared
  # by both jobs below rather than each rebuilding independently.
  prepare_wasm:
    name: Prepare wasm module (reuse static.yml artifact if available)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CMAKE_GENERATOR: Ninja
      EMSCRIPTEN_VERSION: "5.0.0"
    steps:
      - uses: actions/checkout@v7

      - name: Look for a matching static.yml run to reuse
        id: find_run
        uses: actions/github-script@v9
        with:
          script: |
            const headSha = ${{ toJSON(github.event.pull_request.head.sha || github.sha) }};
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "static.yml",
                status: "success",
                per_page: 30,
              });
              const match = runs.data.workflow_runs.find((r) => r.head_sha === headSha);
              if (!match) {
                core.info(`no successful static.yml run found for ${headSha}`);
                core.setOutput("found", "false");
                return;
              }
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: match.id,
              });
              const art = artifacts.data.artifacts.find(
                (a) => a.name === "onnxsim-wasm-ortweb" && !a.expired,
              );
              if (!art) {
                core.info(`static.yml run ${match.id} has no (unexpired) onnxsim-wasm-ortweb artifact`);
                core.setOutput("found", "false");
                return;
              }
              core.info(`reusing onnxsim-wasm-ortweb from static.yml run ${match.id}`);
              core.setOutput("found", "true");
              core.setOutput("run_id", String(match.id));
            } catch (err) {
              // Best-effort: any API hiccup just falls back to building from source.
              core.warning(`static.yml artifact lookup failed, will build from source: ${err}`);
              core.setOutput("found", "false");
            }

      - name: Download reused wasm module
        if: steps.find_run.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          name: onnxsim-wasm-ortweb
          path: build-wasm-node-OFF-ortweb
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Fallback: build from source (only runs when nothing was reused) ---
      - name: Fetch submodules (fallback build only)
        if: steps.find_run.outputs.found != 'true'
        run: git submodule update --init --recursive
      - if: steps.find_run.outputs.found != 'true'
        run: pip install cmake ninja
      # Matches static.yml: the ORT-web build forces ONNX_BUILD_CUSTOM_PROTOBUF=ON,
      # so onnx fetches and builds protobuf 6.31.1 for the wasm target, and the
      # host protoc used for codegen must match that version.
      - name: Install protoc 31.1 (matches onnx's bundled protobuf 6.31.1)
        if: steps.find_run.outputs.found != 'true'
        run: |
          PROTOC_VERSION=31.1
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: Prepare ccache timestamp
        if: steps.find_run.outputs.found != 'true'
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -Iseconds)" >> "${GITHUB_OUTPUT}"
      - name: ccache cache files
        if: steps.find_run.outputs.found != 'true'
        uses: actions/cache@v6
        with:
          path: .ccache
          key: npm-publish-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            npm-publish-ccache-
      - if: steps.find_run.outputs.found != 'true'
        run: |
          sudo apt install -y ccache
          echo "CCACHE_DIR=${PWD}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_MAXSIZE=500M" >> "${GITHUB_ENV}"
          echo "_EMCC_CCACHE=1" >> "${GITHUB_ENV}"
      - name: Build the ORT-web wasm module from source
        if: steps.find_run.outputs.found != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "${EMSCRIPTEN_VERSION}"
          ./emsdk/emsdk activate "${EMSCRIPTEN_VERSION}"
          . ./emsdk/emsdk_env.sh
          ORT_WEB=ON ./build_wasm.sh

      # Stages onnxsim.{js->cjs,wasm} + ort_executor.mjs into npm/onnxsim/,
      # whether they came from the download or the fallback build above.
      - run: ./scripts/stage_npm_package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: npm-onnxsim-package
          path: |
            npm/onnxsim/onnxsim.cjs
            npm/onnxsim/onnxsim.wasm
            npm/onnxsim/ort_executor.mjs
          retention-days: 7

  # Runs on every PR touching the package so packaging breakage is caught
  # before a release, without needing publish credentials.
  build_and_pack:
    name: dry-run npm publish (no publish)
    needs: prepare_wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-onnxsim-package
          path: npm/onnxsim
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # --dry-run runs everything `npm publish` would (prepublishOnly, pack,
      # registry checks) without uploading, and needs no auth token -- a
      # closer packaging smoke test than `npm pack` for no extra cost.
      - name: npm publish --dry-run (packaging smoke test, no publish)
        working-directory: npm/onnxsim
        run: npm publish --dry-run

  publish:
    # Only a maintainer publishing a GitHub release (tagged v*) or an explicit
    # manual re-run actually pushes to the npm registry.
    if: >-
      github.repository == 'onnxsim/onnxsim' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v'))
      )
    name: Publish to npm
    needs: prepare_wasm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/onnxsim
    permissions:
      contents: read
      # Required for npm's OIDC trusted publishing (npm CLI >= 11.5.1) --
      # exchanges this workflow's identity for a short-lived publish token, so
      # no NPM_TOKEN secret is stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-onnxsim-package
          path: npm/onnxsim
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # `npm stage` (staged publishing, https://docs.npmjs.com/staged-publishing)
      # needs npm CLI >= 11.15.0; setup-node's bundled version can lag behind it.
      - run: npm install -g npm@latest
      # This CI job only *stages* the release -- it does not go live on its
      # own. `npm stage publish` uploads the tarball to a review queue instead
      # of the registry; a maintainer with 2FA still has to run
      # `npm stage approve <stage-id>` (or approve on npmjs.com) before it's
      # installable. That keeps a compromised workflow (or a compromised
      # transitive build dependency) from being able to push a live release by
      # itself -- OIDC trusted publishing here can only propose one.
      #
      # The `onnxsim` package's trusted publisher entry on npmjs.com must list
      # this workflow (npm-publish.yml) with "npm stage publish" among its
      # allowed actions (ideally stage-only, rejecting direct `npm publish`)
      # for this to succeed -- that's a one-time setting on the package's
      # npmjs.com settings page, not something this workflow can configure.
      - name: npm stage publish
        working-directory: npm/onnxsim
        run: npm stage publish --provenance
