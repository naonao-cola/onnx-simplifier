name: Halide Integration

# End-to-end regression test that feeds onnxsim's simplified output into a
# small ONNX-subset-to-Halide lowering (tests/test_halide_integration.py).
# docs/dlpack-executor.md frames onnxsim's DLPack executor boundary as an
# "embeddability" seam for other ONNX-based compiler/runtime stacks; this
# workflow is the regression test for that claim against Halide, mirroring
# tvm-integration.yml.
#
# The halide PyPI package is not part of onnxsim's test requirements, so this
# runs in its own workflow instead of the build-and-test matrix. Runs on PRs
# that touch the harness or the simplifier, on a daily schedule to catch new
# Halide releases, and on demand.

on:
  schedule:
    - cron: "0 7 * * *" # Daily 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/test_halide_integration.py"
      - ".github/workflows/halide-integration.yml"
      - "onnxsim/onnx_simplifier.py"
      - "onnxsim/onnxsim.cpp"
      - "docs/dlpack-executor.md"

concurrency:
  group: halide-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build onnxsim once from the current tree, exactly like the model-regression
  # workflow, and hand the wheel to the test job so it exercises this branch's
  # code rather than a PyPI release.
  build:
    name: Build onnxsim wheel
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build cp312 wheel
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
          CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      - uses: actions/upload-artifact@v7
        with:
          name: onnxsim-wheel-halide
          path: ./wheelhouse/*.whl

  test:
    name: Simplify and run on Halide
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel-halide
          path: wheelhouse
      - name: Install onnxsim wheel + halide
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest halide
          python -m pip install wheelhouse/*.whl
      - name: Verify the installed wheel is used (not the source tree)
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import onnxsim, onnxsim.onnxsim_cpp2py_export as m; print(onnxsim.__version__, m.__file__)"
          python -c "import halide as hl; print('halide', hl.__file__)"
      # Run from a neutral directory so the repo root's ./onnxsim source package
      # (without the compiled extension) does not shadow the installed wheel.
      - name: Run Halide integration tests
        working-directory: ${{ runner.temp }}
        run: pytest -v "$GITHUB_WORKSPACE/tests/test_halide_integration.py"
