name: Label auto-merge PRs

# Applies an "automerge" label while a PR has auto-merge enabled, and removes
# it again once auto-merge is disabled (manually, or by GitHub after the PR
# merges/closes) -- so reviewers can spot "will merge itself once green"
# PRs from the issue/PR list without opening each one.
#
# pull_request_target (rather than pull_request) so the workflow runs with
# the base repo's GITHUB_TOKEN even when auto-merge is toggled on a PR from a
# fork; nothing from the PR head is checked out or executed, only PR metadata
# is read, so this is safe.

on:
  pull_request_target:
    types: [auto_merge_enabled, auto_merge_disabled]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-slim
    steps:
      - name: Add or remove the automerge label
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'automerge';
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;

            if (context.payload.action === 'auto_merge_enabled') {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (e) {
                await github.rest.issues.createLabel({
                  owner, repo, name: label,
                  color: '0e8a16',
                  description: 'Auto-merge is enabled for this PR',
                });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr_number, labels: [label] });
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr_number, name: label });
              } catch (e) {
                // Label was already absent (e.g. removed manually); nothing to do.
              }
            }
