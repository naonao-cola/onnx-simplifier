# Compile-check the experimental ORT-web WASM variant (ORT_WEB=ON): onnxsim's
# WebAssembly build that links no ONNX Runtime and delegates constant folding to
# the page's onnxruntime-web (see docs/wasm_ort_web.md). This only builds the
# module to catch compile/link regressions in that path; the default WASM build
# and its deploy live in static.yml.
name: WASM ORT-web build

on:
  push:
    branches: ["master", "pages"]
    paths:
      - ".github/workflows/wasm-ort-web.yml"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "scripts/convertmodel/**"
      - ".gitmodules"
  pull_request:
    paths:
      - ".github/workflows/wasm-ort-web.yml"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "scripts/convertmodel/**"
      - ".gitmodules"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      EMSCRIPTEN_VERSION: "5.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: pip install cmake ninja
      # onnx (ONNX_BUILD_CUSTOM_PROTOBUF) fetches and builds protobuf 25.1 for the
      # wasm target -- see its sbom.cdx.json. build_wasm.sh passes `which protoc`
      # as ONNX_CUSTOM_PROTOC_EXECUTABLE for codegen, so the host protoc MUST match
      # that version or the generated .pb.* code is incompatible with the runtime
      # headers. Ubuntu's apt protobuf-compiler is too old, so install protoc 25.1.
      - name: Install protoc 25.1 (matches onnx's bundled protobuf)
        run: |
          PROTOC_VERSION=25.1
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: echo "timestamp=$(date -Iseconds)" >> ${GITHUB_OUTPUT}
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: .ccache
          key: wasm-ort-web-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            wasm-ort-web-ccache-
      - run: |
          sudo apt install -y ccache
          ccache -z
          echo "CCACHE_DIR=${PWD}/.ccache" >> ${GITHUB_ENV}
          echo "CCACHE_MAXSIZE=500M" >> ${GITHUB_ENV}
          echo "_EMCC_CCACHE=1" >> ${GITHUB_ENV}
      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk activate ${EMSCRIPTEN_VERSION}
      - name: Build the ORT-web WASM variant
        run: |
          . ./emsdk/emsdk_env.sh
          ORT_WEB=ON ./build_wasm.sh
      - name: Sanity-check the build output exists
        run: |
          ls -la build-wasm-node-OFF-ortweb/onnxsim.js build-wasm-node-OFF-ortweb/onnxsim.wasm
      - name: ccache statistics
        if: always()
        run: ccache -s
