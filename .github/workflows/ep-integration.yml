name: Execution Provider Integration

# Compiles and runs onnxsim's output through onnxruntime execution providers
# (Intel's OpenVINO EP, the Qualcomm AI Runtime / QNN EP) to catch
# simplifications that break those toolchains, or whose on-device result
# changed. Both run entirely on a stock x86-64 CPU runner via their pip EP
# wheels (onnxruntime-openvino, onnxruntime-qnn) -- no discrete Intel/Qualcomm
# hardware needed. See scripts/intel/README.md and scripts/qualcomm/README.md
# for the fidelity tiers each covers.
#
# These two checks used to live in their own workflow files
# (intel-integration.yml, qualcomm-integration.yml), each independently
# building an identical cp312 manylinux wheel from the same commit via
# cibuildwheel. Merged here into one workflow: the wheel is built once and
# shared with both EP checks, exactly like model-regression.yml already does
# for its shards.
#
# Scheduled + on demand, plus on PRs that touch either harness so they stay
# valid.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC (weekly)
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ep-integration.yml"
      - "scripts/intel/**"
      - "scripts/qualcomm/**"
      - "scripts/common/**"
      - "tests/test_openvino_compat.py"
      - "tests/test_qnn_compat.py"

concurrency:
  group: ep-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build onnxsim once from the current tree, so both EP checks run against
  # the actual simplifier in this branch rather than a released wheel.
  build:
    name: Build onnxsim wheel
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build cp312 wheel
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: CI SCCACHE_GHA_ENABLED ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_SERVICE_V2
          CIBW_BEFORE_BUILD: "python3 -m pip install --break-system-packages cmake ninja setuptools sccache nanobind"
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=OFF" CMAKE_GENERATOR=Ninja CMAKE_CXX_COMPILER_LAUNCHER=sccache CMAKE_LINKER_TYPE=LLD
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w {dest_dir} {wheel} --strip"
      - uses: actions/upload-artifact@v7
        with:
          name: onnxsim-wheel-ep
          path: ./wheelhouse/*.whl

  openvino:
    name: OpenVINO compatibility check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel-ep
          path: wheelhouse
      - name: Install onnxsim wheel + onnxruntime-openvino
        run: |
          python -m pip install --upgrade pip
          # onnxruntime-openvino replaces plain onnxruntime (bundles its own EP).
          python -m pip install onnxruntime-openvino
          python -m pip install wheelhouse/*.whl
      # Run from runner.temp, not the checkout: the repo root contains the
      # `onnxsim/` source dir (no compiled extension), which would shadow the
      # installed wheel on `import onnxsim`. Reference the harness by absolute
      # $GITHUB_WORKSPACE path. Same guard the QNN/model-regression workflows use.
      - name: Show environment
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import onnxsim, onnxruntime as ort; print('onnxsim', onnxsim.__version__); print('onnxruntime', ort.__version__); print('providers', ort.get_available_providers())"
      - name: Run OpenVINO compatibility check
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/intel/run_openvino_compat.py" \
            --require-openvino \
            --output openvino-compat.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openvino-compat-report
          path: ${{ runner.temp }}/openvino-compat.csv
          if-no-files-found: ignore

  qnn:
    name: QNN compatibility check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # onnxruntime-qnn ships cp311/cp312/cp313 x86-64 Linux wheels.
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: onnxsim-wheel-ep
          path: wheelhouse
      - name: Install onnxsim wheel + onnxruntime-qnn
        run: |
          python -m pip install --upgrade pip
          # onnxruntime-qnn brings its own onnxruntime (the QNN plugin EP).
          python -m pip install onnxruntime-qnn
          python -m pip install wheelhouse/*.whl
      # Run from runner.temp, not the checkout: the repo root contains the
      # `onnxsim/` source dir (no compiled extension), which would shadow the
      # installed wheel on `import onnxsim`. Reference the harness by absolute
      # $GITHUB_WORKSPACE path. Same guard the model-regression workflow uses.
      - name: Show environment
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import onnxsim, onnxruntime_qnn as q; print('onnxsim', onnxsim.__version__); print('onnxruntime-qnn', q.__version__)"
          python -c "import sys, os; sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts', 'qualcomm')); import qnn_backend as q; print('QNN available:', q.QNN_AVAILABLE, '| backend:', q.backend_path() if q.QNN_AVAILABLE else q.unavailable_reason())"
      - name: Run QNN compatibility check
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/scripts/qualcomm/run_qnn_compat.py" \
            --require-qnn \
            --output qnn-compat.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qnn-compat-report
          path: ${{ runner.temp }}/qnn-compat.csv
          if-no-files-found: ignore
