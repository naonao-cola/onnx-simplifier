name: Apple Integration

# Compiles and runs onnxsim's output through Apple's Core ML execution
# provider and tinygrad's Metal device backend to catch simplifications that
# break those toolchains, or whose on-device result changed.
#
# Runs on a stock macOS GitHub-hosted runner: the CoreMLExecutionProvider is
# built into the standard `onnxruntime` PyPI wheel's macOS build, and Metal
# ships as part of the OS, so no extra package or device is needed beyond
# the Mac itself. See scripts/apple/README.md and scripts/hexagon/README.md
# for the fidelity tiers each covers.
#
# Scheduled + on demand (like the Qualcomm check), plus on PRs that touch
# either harness so they stay valid.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC (weekly)
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/apple-integration.yml"
      - "scripts/apple/**"
      - "scripts/hexagon/**"
      - "scripts/common/**"
      - "tests/test_coreml_compat.py"
      - "tests/test_tinygrad_hexagon_compat.py"
      - "tests/test_rustnn_runtime.py"
      - "tests/test_webnn_tinygrad_tuning.py"
      - "onnxsim/rustnn_runtime.py"
      - "onnxsim/webnn_tinygrad_tuning.py"

concurrency:
  group: apple-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coreml-compat:
    name: Core ML compatibility check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install onnxsim + onnxruntime
        run: |
          python3 -m pip install --upgrade pip
          # The macOS onnxruntime wheel bundles the Core ML EP.
          python3 -m pip install onnxruntime
          python3 -m pip install .
      # Run from runner.temp, not the checkout: the repo root contains the
      # `onnxsim/` source dir (no compiled extension), which would shadow the
      # installed wheel on `import onnxsim`. Reference the harness by absolute
      # $GITHUB_WORKSPACE path. Same guard the QNN/OpenVINO workflows use.
      - name: Show environment
        working-directory: ${{ runner.temp }}
        run: |
          python3 -c "import onnxsim, onnxruntime as ort; print('onnxsim', onnxsim.__version__); print('onnxruntime', ort.__version__); print('providers', ort.get_available_providers())"
      - name: Run Core ML compatibility check
        working-directory: ${{ runner.temp }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/apple/run_coreml_compat.py" \
            --require-coreml \
            --output coreml-compat.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coreml-compat-report
          path: ${{ runner.temp }}/coreml-compat.csv
          if-no-files-found: ignore

  tinygrad-metal:
    name: tinygrad Metal compatibility check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install onnxsim + tinygrad
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest tinygrad
          python3 -m pip install .
      # Run from runner.temp, not the checkout: the repo root contains the
      # `onnxsim/` source dir (no compiled extension), which would shadow the
      # installed wheel on `import onnxsim`. Reference the harness by absolute
      # $GITHUB_WORKSPACE path. Same guard the other compat workflows use.
      - name: Show environment
        working-directory: ${{ runner.temp }}
        run: |
          python3 -c "import onnxsim; print('onnxsim', onnxsim.__version__)"
          python3 -c "import sys, os; sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'scripts', 'hexagon')); import tinygrad_hexagon_backend as b; print('METAL available:', b.METAL_AVAILABLE, b.unavailable_reason('METAL') or '')"
      - name: Run tinygrad Metal compatibility check
        working-directory: ${{ runner.temp }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/hexagon/run_hexagon_compat.py" \
            --device METAL \
            --require-device \
            --output metal-compat.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metal-compat-report
          path: ${{ runner.temp }}/metal-compat.csv
          if-no-files-found: ignore

  # rustnn (native W3C WebNN, via pywebnn) on Apple silicon, timed per node
  # against tinygrad. pywebnn 0.5.12's device types on macOS:
  #   cpu -> ONNX Runtime CPU EP
  #   npu -> Core ML (MLComputeUnits.cpuAndNeuralEngine, falling back to .all)
  #   gpu -> NOT a GPU: rustnn only registers ORT's CPU EP, so it's skipped here
  # The GPU side comes from tinygrad's METAL device instead. Core ML decides
  # per op where it really runs, and a virtualized runner may expose no
  # Neural Engine, so "npu" proves the Core ML path works, not ANE placement.
  # See docs/rustnn.md.
  rustnn-webnn:
    name: rustnn WebNN (CPU / Core ML) vs. tinygrad (CPU / Metal)
    runs-on: macos-15
    # ~21 min of this is building onnxsim from source on the runner; the
    # benchmark adds tinygrad BEAM=2 searches on Metal on top.
    timeout-minutes: 60
    env:
      # Only the core simplifier is needed; skip the quantization/pruning
      # algorithm library to cut compile time (see CLAUDE.md).
      ONNXSIM_NON_CORE_FEATURES: "0"
      ONNXSIM_RUSTNN_DEVICE_TYPES: "cpu,npu"
      ONNXSIM_TINYGRAD_DEVICES: "CPU,METAL"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          # pywebnn 0.5.12 ships a macOS arm64 wheel for CPython 3.12 only.
          python-version: "3.12"
      - name: Install onnxsim + pywebnn + onnxruntime + tinygrad
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest "pywebnn>=0.5.12" onnxruntime "tinygrad==0.14.0"
          python3 -m pip install .
      # Run from runner.temp so the checkout's onnxsim/ source dir (no
      # compiled extension) doesn't shadow the installed package.
      - name: Show environment
        working-directory: ${{ runner.temp }}
        run: |
          sysctl -n machdep.cpu.brand_string || true
          system_profiler SPDisplaysDataType | head -20 || true
          python3 -c "import onnxsim; print('onnxsim', onnxsim.__version__); print('cpu', onnxsim.probe_rustnn('cpu')); print('npu', onnxsim.probe_rustnn('npu'))"
          python3 -c "from tinygrad import Device; print('tinygrad devices', list(Device.get_available_devices()))"
      - name: Run rustnn + WebNN/tinygrad tuning tests (cpu, npu / CPU, METAL)
        working-directory: ${{ runner.temp }}
        run: >-
          pytest -v -rs
          "$GITHUB_WORKSPACE/tests/test_rustnn_runtime.py"
          "$GITHUB_WORKSPACE/tests/test_webnn_tinygrad_tuning.py"
      - name: Benchmark WebNN vs. tinygrad
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apple/benchmark_webnn_tinygrad.py" \
            --webnn-device-types cpu,npu \
            --tinygrad-devices CPU,METAL \
            --beams 0,2 \
            --require npu,METAL \
            --output webnn-tinygrad.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webnn-tinygrad-report
          path: ${{ runner.temp }}/webnn-tinygrad.json
          if-no-files-found: ignore
