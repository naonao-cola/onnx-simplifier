# Builds the WASM convertmodel demo, then:
#   - on push to master/pages: deploys it to GitHub Pages (production)
#   - on a `/preview` PR comment: deploys a per-PR preview to Cloudflare Pages
#   - on a `v*` GitHub release: stages the `onnxsim` npm package for release
#     (npm/onnxsim/; see docs/wasm_ort_web.md "npm package" section)
#   - on a pull request touching wasm/npm paths: builds the wasm module and
#     validates the npm package (tests + `npm publish --dry-run`), but skips
#     the (unrelated, expensive) Netron build and never deploys anywhere
#
# The npm package ships the exact same ORT-web wasm module as the demo, so its
# packaging (npm publish --dry-run, and on a release npm stage publish) rides
# along with whichever build this workflow is already doing, rather than a
# separate workflow rebuilding the module a second time.
#
# The hosted demo preview is on-demand rather than automatic: the full build
# (emscripten + a full Netron web build) is expensive, and most PRs don't touch
# the demo or don't need a hosted preview of it. Comment `/preview` on a pull
# request and this workflow builds that PR's head and deploys it, replying with
# the URL. The npm build+validate above is a separate, cheaper path (no Netron)
# that runs unconditionally on a relevant PR, since it's the only per-PR
# coverage npm packaging gets.
#
# The demo is built as the ORT-web variant (ONNXSIM_WASM_ORT_WEB=ON): onnxsim's
# WebAssembly module links no ONNX Runtime and delegates constant folding to the
# page's onnxruntime-web (worker.js loads it and registers the runner; see
# docs/wasm_ort_web.md). onnx builds its bundled protobuf 6.31.1 for the wasm
# target, so the host protoc must match that version for codegen.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master", "pages"]
    # Only rebuild/deploy the WASM convertmodel demo when files that actually
    # affect it change (the C++ sources, the build scripts, the demo assets,
    # or this workflow itself).
    paths:
      - ".github/workflows/static.yml"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "scripts/convertmodel/**"
      - "scripts/regression/models.json"
      - "npm/onnxsim/**"
      - "scripts/build_npm_package.sh"
      - "scripts/stage_npm_package.sh"
      - ".gitmodules"

  # Validates the wasm build + npm package on every PR that touches it (same
  # paths as the push trigger above) -- see the "Demo-only" step gates below
  # for what this skips (Netron, Pages/Cloudflare deploy) to keep it cheaper
  # than a full demo build.
  pull_request:
    paths:
      - ".github/workflows/static.yml"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "scripts/convertmodel/**"
      - "scripts/regression/models.json"
      - "npm/onnxsim/**"
      - "scripts/build_npm_package.sh"
      - "scripts/stage_npm_package.sh"
      - ".gitmodules"

  # Per-PR Cloudflare previews are opt-in: comment `/preview` on the pull
  # request. `issue_comment` has no path filter, which is fine — the whole point
  # is that a human asked for this build.
  issue_comment:
    types: [created]

  # Stages the `onnxsim` npm package for a maintainer to approve (see the "npm
  # stage publish" step below) — only a GitHub release actually attempts this,
  # not workflow_dispatch, so a manual "redeploy the demo" run can never
  # accidentally touch npm.
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages, to
# react to the `/preview` comment and post the Cloudflare preview URL back on
# the PR (PR conversation comments go through the issues API), and (id-token)
# for npm's OIDC trusted publishing on a release -- the same token also used
# for the Pages OIDC deployment below, just exchanged with a different party.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# `/preview` runs are keyed by PR number: an `issue_comment` run reports
# github.ref as the default branch, so without this a preview would share a
# group with — and cancel — the production Pages deployment. A release run's
# github.ref is its tag, which is unique per release, so it never collides
# with a push or preview group either.
concurrency:
  group: "pages-${{ github.event.issue.number || github.ref }}"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # For comments: only `/preview` on a pull request, and only from someone
    # with write access. That last check matters — an `issue_comment` run
    # executes with the repo's secrets, and the preview builds the PR head
    # (possibly from a fork), so a maintainer has to ask for it.
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/preview') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    environment:
      name: ${{ case(github.event_name == 'push', 'github-pages', github.event_name == 'release', 'npm', '') }}
      url: ${{ github.event_name == 'release' && 'https://www.npmjs.com/package/onnxsim' || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      EMSCRIPTEN_VERSION: "5.0.0"
      # Surfaced so the Cloudflare preview steps can gate on the secret being
      # present. `issue_comment` runs always get the repo's secrets (they run in
      # the base repo's context, not the PR's), so this is only empty in a fork
      # of this repo that has not configured its own Cloudflare credentials.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # An `issue_comment` payload carries no head ref, so ask the API which
      # commit the PR currently points at and build exactly that. The 👀
      # reaction is the "your build started" ack, since the run itself is not
      # attached to the PR's checks.
      - name: Resolve the PR the comment is on
        id: pr
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });
            core.setOutput('head_repo', pr.head.repo.full_name);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
            });
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Empty for push/release/workflow_dispatch, which keeps checkout's
          # default (the ref that triggered the run — a release run checks out
          # its tag).
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          submodules: recursive
      - name: Setup Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/configure-pages@v6
      - run: pip install cmake ninja
      # The ORT-web build forces ONNX_BUILD_CUSTOM_PROTOBUF=ON (CMakeLists.txt),
      # so onnx fetches and builds protobuf 6.31.1 for the wasm target (see its
      # sbom.cdx.json). build_wasm.sh passes `which protoc` as
      # ONNX_CUSTOM_PROTOC_EXECUTABLE for codegen, so the host protoc MUST match
      # that version or the generated .pb.* code is incompatible with the runtime
      # headers. Ubuntu's apt protobuf-compiler is too old, so install protoc 31.1.
      - name: Install protoc 31.1 (matches onnx's bundled protobuf 6.31.1)
        run: |
          PROTOC_VERSION=31.1
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          echo "timestamp=$(date -Iseconds)" >> ${GITHUB_OUTPUT}
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ matrix.config.name }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
              ${{ matrix.config.name }}-ccache-
      - run: |
          sudo apt install -y ccache
          which ccache
          ccache -z
          echo "CCACHE_DIR=${PWD}/.ccache" >> ${GITHUB_ENV}
          echo "CCACHE_MAXSIZE=500M" >> ${GITHUB_ENV}
          echo "_EMCC_CCACHE=1" >> ${GITHUB_ENV}
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk activate ${EMSCRIPTEN_VERSION}
          . ./emsdk/emsdk_env.sh
          EMPROFILE=1 ORT_WEB=ON ./build_wasm.sh
          rm scripts/convertmodel/onnxsim.*
          cp build-wasm-node-OFF-ortweb/onnxsim.* scripts/convertmodel
      # Surface ccache statistics on the run's summary page, the same way
      # mozilla-actions/sccache-action does for sccache. `ccache -s` still
      # goes to the step log too, so the numbers are available in both places.
      - name: ccache statistics
        if: always()
        run: |
          {
            echo "### ccache statistics"
            echo ""
            echo '```'
            ccache -s
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          ccache -s

      # Moved ahead of the Netron build (which also needs it) so the npm
      # packaging steps below can use it too.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # --- npm package (npm/onnxsim/): stage onnxsim.{js->cjs,wasm} + the
      # shared JS executor from the module just built above; see
      # docs/wasm_ort_web.md "npm package".
      - run: ./scripts/stage_npm_package.sh
      # `npm stage` (staged publishing, https://docs.npmjs.com/staged-publishing)
      # needs npm CLI >= 11.15.0; setup-node's bundled version can lag behind it.
      - run: npm install -g npm@latest
      # Installs onnxruntime-web, the package's one runtime dependency -- needed
      # both to actually run test/index.test.mjs below and because
      # index.mjs always imports it (the npm build always reports
      # onnxsim_needs_ort_web() true; see docs/wasm_ort_web.md).
      - name: Install npm/onnxsim's dependencies
        working-directory: npm/onnxsim
        run: npm install
      # The version actually published to npm must match the release tag
      # exactly, regardless of whatever version happens to be committed in
      # package.json right now -- the automated bump PR
      # (.github/workflows/version-sync.yml) only updates that file after the
      # release, and a maintainer still has to merge it, so it can't be
      # trusted to have landed before this step runs.
      - name: Set npm package version to the release tag
        if: >-
          github.repository == 'onnxsim/onnxsim' &&
          github.event_name == 'release' &&
          startsWith(github.ref, 'refs/tags/v')
        working-directory: npm/onnxsim
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version
      # `npm publish`'s prepublishOnly hook (package.json) runs
      # test/index.test.mjs against the module just built above, so this one
      # step is both the packaging smoke test AND the unit test run -- no
      # separate CI step duplicates it. Runs on every trigger of this workflow
      # (push, pull_request, /preview, workflow_dispatch, release) --
      # exercises the same registry-shaped checks a real publish would,
      # without uploading or needing auth.
      - name: npm publish --dry-run (runs the unit tests, packaging smoke test, no publish)
        working-directory: npm/onnxsim
        run: npm publish --dry-run
      # This only *stages* the release -- it does not go live on its own.
      # `npm stage publish` uploads the tarball to a review queue instead of
      # the registry; a maintainer with 2FA still has to run
      # `npm stage approve <stage-id>` (or approve on npmjs.com) before it's
      # installable. That keeps a compromised workflow (or a compromised
      # transitive build dependency) from being able to push a live release by
      # itself -- OIDC trusted publishing here can only propose one.
      #
      # The `onnxsim` package's trusted publisher entry on npmjs.com must list
      # this workflow (static.yml) with "npm stage publish" among its allowed
      # actions (ideally stage-only, rejecting direct `npm publish`) for this
      # to succeed -- that's a one-time setting on the package's npmjs.com
      # settings page, not something this workflow can configure.
      - name: npm stage publish
        if: >-
          github.repository == 'onnxsim/onnxsim' &&
          github.event_name == 'release' &&
          startsWith(github.ref, 'refs/tags/v')
        working-directory: npm/onnxsim
        run: npm stage publish --provenance

      # Ship the curated regression model set next to the page so the
      # "Load from Hugging Face" dropdown can fetch it same-origin (it falls
      # back to the raw GitHub copy when this file is absent, e.g. local dev).
      # Demo-only: only push (production) and issue_comment (/preview) actually
      # deploy the demo, so a release or plain pull_request run skips this.
      - if: ${{ github.event_name == 'push' || github.event_name == 'issue_comment' }}
        run: cp scripts/regression/models.json scripts/convertmodel/models.json

      # Build the patched Netron (embedding protocol + embedded mode) and serve
      # it from the converter's own origin at ./netron/, so the page can post
      # models straight into it — no upload, no URL-length limit. Demo-only
      # (see above) -- skipping it is what keeps the pull_request validation
      # path cheaper than a full demo build.
      - name: Build and embed Netron
        if: ${{ github.event_name == 'push' || github.event_name == 'issue_comment' }}
        env:
          NETRON_REPO: https://github.com/onnxsim/netron
          # Netron 9.1.9 + the embedding protocol, now also exposing an
          # `export` command so the page's "export SVG" buttons can save the
          # rendered graph (see the onnxsim/netron branch / docs/embedding.md).
          NETRON_REF: claude/wasm-netron-svg-export
        run: |
          git clone --depth 1 --branch "$NETRON_REF" "$NETRON_REPO" netron-src
          (cd netron-src && node package.js build web)
          rm -rf scripts/convertmodel/netron
          cp -r netron-src/dist/web scripts/convertmodel/netron

      # --- Production: GitHub Pages (push to master/pages only) ---
      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: 'scripts/convertmodel'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        if: ${{ github.event_name == 'push' }}

      # --- Preview: Cloudflare Pages (`/preview` comment only) ---
      # A fork of this repo will not have CLOUDFLARE_API_TOKEN configured, so
      # gate on it being set: those runs skip the deploy instead of failing
      # wrangler with "CLOUDFLARE_API_TOKEN is necessary".
      - name: Deploy preview to Cloudflare Pages
        id: cf_deploy
        if: ${{ github.event_name == 'issue_comment' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A branch that is NOT the project's production branch produces a
          # preview deployment with a stable <branch>.<project>.pages.dev alias.
          command: >-
            pages deploy scripts/convertmodel
            --project-name=onnxsim
            --branch=${{ steps.pr.outputs.head_ref }}
      - name: Comment preview URL on the PR
        if: ${{ github.event_name == 'issue_comment' && env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const url = ${{ toJSON(steps.cf_deploy.outputs.deployment-url) }};
            const alias = ${{ toJSON(steps.cf_deploy.outputs.pages-deployment-alias-url) }};
            const sha = ${{ toJSON(steps.pr.outputs.head_sha) }};
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = [
              marker,
              '### ⚡ Cloudflare Pages preview',
              '',
              `| | URL |`,
              `| --- | --- |`,
              `| **This build** | ${url} |`,
              alias ? `| **Branch alias** | ${alias} |` : '',
              '',
              `_Preview of ${sha.slice(0, 7)} — comment \`/preview\` again to rebuild._`,
            ].filter(Boolean).join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
