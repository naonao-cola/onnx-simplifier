# Builds the WASM convertmodel demo once, then:
#   - on push to master/pages: deploys it to GitHub Pages (production)
#   - on pull_request:          deploys a per-PR preview to Cloudflare Pages
#
# The demo is built as the ORT-web variant (ONNXSIM_WASM_ORT_WEB=ON): onnxsim's
# WebAssembly module links no ONNX Runtime and delegates constant folding to the
# page's onnxruntime-web (worker.js loads it and registers the runner; see
# docs/wasm_ort_web.md). onnx builds its bundled protobuf 6.31.1 for the wasm
# target, so the host protoc must match that version for codegen.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master", "pages"]
    # Only rebuild/deploy the WASM convertmodel demo when files that actually
    # affect it change (the C++ sources, the build scripts, the demo assets,
    # or this workflow itself).
    paths:
      - ".github/workflows/static.yml"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "scripts/convertmodel/**"
      - "scripts/regression/models.json"
      - ".gitmodules"

  pull_request:
    paths:
      - ".github/workflows/static.yml"
      - "build_wasm.sh"
      - "CMakeLists.txt"
      - "cmake/**"
      - "onnxsim/**"
      - "scripts/convertmodel/**"
      - "scripts/regression/models.json"
      - ".gitmodules"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# and to post the Cloudflare preview URL as a PR comment.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: ${{ case(github.event_name == 'push', 'github-pages', '') }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      EMSCRIPTEN_VERSION: "5.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Pages
        if: ${{ github.event_name == 'push' }}
        uses: actions/configure-pages@v6
      - run: pip install cmake ninja
      # The ORT-web build forces ONNX_BUILD_CUSTOM_PROTOBUF=ON (CMakeLists.txt),
      # so onnx fetches and builds protobuf 6.31.1 for the wasm target (see its
      # sbom.cdx.json). build_wasm.sh passes `which protoc` as
      # ONNX_CUSTOM_PROTOC_EXECUTABLE for codegen, so the host protoc MUST match
      # that version or the generated .pb.* code is incompatible with the runtime
      # headers. Ubuntu's apt protobuf-compiler is too old, so install protoc 31.1.
      - name: Install protoc 31.1 (matches onnx's bundled protobuf 6.31.1)
        run: |
          PROTOC_VERSION=31.1
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          echo "timestamp=$(date -Iseconds)" >> ${GITHUB_OUTPUT}
      - name: ccache cache files
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ matrix.config.name }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
              ${{ matrix.config.name }}-ccache-
      - run: |
          sudo apt install -y ccache
          which ccache
          ccache -z
          echo "CCACHE_DIR=${PWD}/.ccache" >> ${GITHUB_ENV}
          echo "CCACHE_MAXSIZE=500M" >> ${GITHUB_ENV}
          echo "_EMCC_CCACHE=1" >> ${GITHUB_ENV}
      - run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk activate ${EMSCRIPTEN_VERSION}
          . ./emsdk/emsdk_env.sh
          EMPROFILE=1 ORT_WEB=ON ./build_wasm.sh
          rm scripts/convertmodel/onnxsim.*
          cp build-wasm-node-OFF-ortweb/onnxsim.* scripts/convertmodel
      # Surface ccache statistics on the run's summary page, the same way
      # mozilla-actions/sccache-action does for sccache. `ccache -s` still
      # goes to the step log too, so the numbers are available in both places.
      - name: ccache statistics
        if: always()
        run: |
          {
            echo "### ccache statistics"
            echo ""
            echo '```'
            ccache -s
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          ccache -s

      # Ship the curated regression model set next to the page so the
      # "Load from Hugging Face" dropdown can fetch it same-origin (it falls
      # back to the raw GitHub copy when this file is absent, e.g. local dev).
      - run: cp scripts/regression/models.json scripts/convertmodel/models.json

      # Build the patched Netron (embedding protocol + embedded mode) and serve
      # it from the converter's own origin at ./netron/, so the page can post
      # models straight into it — no upload, no URL-length limit.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and embed Netron
        env:
          NETRON_REPO: https://github.com/onnxsim/netron
          # Netron 9.1.9 + the embedding protocol, now also exposing an
          # `export` command so the page's "export SVG" buttons can save the
          # rendered graph (see the onnxsim/netron branch / docs/embedding.md).
          NETRON_REF: claude/wasm-netron-svg-export
        run: |
          git clone --depth 1 --branch "$NETRON_REF" "$NETRON_REPO" netron-src
          (cd netron-src && node package.js build web)
          rm -rf scripts/convertmodel/netron
          cp -r netron-src/dist/web scripts/convertmodel/netron

      # --- Production: GitHub Pages (push to master/pages only) ---
      - name: Upload artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: 'scripts/convertmodel'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        if: ${{ github.event_name == 'push' }}

      # --- Preview: Cloudflare Pages (pull requests only) ---
      # Secrets are not available to pull requests from forks, so skip the
      # deploy there instead of failing. Same-repo branches get previews.
      - name: Deploy preview to Cloudflare Pages
        id: cf_deploy
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A branch that is NOT the project's production branch produces a
          # preview deployment with a stable <branch>.<project>.pages.dev alias.
          command: >-
            pages deploy scripts/convertmodel
            --project-name=onnxsim
            --branch=${{ github.head_ref }}
      - name: Comment preview URL on the PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.cf_deploy.outputs.deployment-url) }};
            const alias = ${{ toJSON(steps.cf_deploy.outputs.pages-deployment-alias-url) }};
            const marker = '<!-- cloudflare-pages-preview -->';
            const body = [
              marker,
              '### ⚡ Cloudflare Pages preview',
              '',
              `| | URL |`,
              `| --- | --- |`,
              `| **This build** | ${url} |`,
              alias ? `| **Branch alias** | ${alias} |` : '',
              '',
              `_Preview of ${context.payload.pull_request.head.sha.slice(0, 7)} — updates on every push to this PR._`,
            ].filter(Boolean).join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
