name: Rust wrapper

on:
  push:
    branches:
      - main
      - master
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: rust

jobs:
  # Fast checks that do not require building the native ONNX Runtime stack.
  # These only type-check/lint (no linking), so the native library is not needed.
  lint:
    name: fmt / clippy (no native build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXSIM_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      # No crates.io publish exists yet for this crate, but a release build
      # should still validate against the tagged version: bump every binding
      # manifest to the release tag (scripts/bump_binding_versions.sh -- the
      # same script version-sync.yml's bump job and static.yml's npm build
      # already run) before clippy resolves the workspace, so this actually
      # exercises the tagged version's onnxsim-sys constraint instead of
      # whatever happened to be committed (this is exactly what broke #606:
      # the workspace version moved but rust/onnxsim/Cargo.toml's pinned
      # onnxsim-sys dependency didn't, and cargo failed to resolve). Once
      # crates.io publishing is added here, this is also where the version
      # would need to be set before `cargo publish`.
      - name: Bump binding versions to the release tag
        if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
        working-directory: ${{ github.workspace }}
        run: ./scripts/bump_binding_versions.sh "${GITHUB_REF#refs/tags/}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Full build that compiles the C API and links it against onnxsim.
  build:
    name: build + smoke test (native)
    runs-on: ubuntu-latest
    # The first build compiles ONNX Runtime, onnx, and protobuf from source
    # (sccache warms subsequent runs), so allow generous headroom.
    timeout-minutes: 120
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "on"
      ACTIONS_CACHE_SERVICE_V2: "on"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # See the matching step in the lint job above for why this runs even
      # though nothing publishes the crate yet.
      - name: Bump binding versions to the release tag
        if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
        working-directory: ${{ github.workspace }}
        run: ./scripts/bump_binding_versions.sh "${GITHUB_REF#refs/tags/}"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # ONNX Runtime source is not a git submodule; onnxsim-sys downloads it on
      # demand. Cache it so it is fetched at most once per version.
      - name: Cache ONNX Runtime source
        uses: actions/cache@v6
        with:
          path: third_party/onnxruntime-1.28.0
          key: onnxruntime-src-1.28.0
      - name: Build the workspace (compiles and links the native library)
        run: cargo build --release --workspace
      - name: Run tests (unit + linked integration tests)
        run: |
          cargo test --release --workspace
          cargo test --release -- --ignored list_optimizers_is_non_empty
