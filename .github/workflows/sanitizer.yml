name: Build and Test with sanitizers

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # A single instrumented build that runs AddressSanitizer and the full
  # UndefinedBehaviorSanitizer suite together over the whole dependency tree
  # (onnxsim, onnx-optimizer, onnx, and its bundled protobuf):
  #   * address    -- use-after-free, heap/stack overflow, leaks (LSan).
  #   * undefined  -- the full UBSan set: misaligned typed loads/stores (the
  #                   class of UB that x86_64 tolerates but that faults with
  #                   SIGBUS on arm64), signed overflow, invalid enum/bool loads,
  #                   null/misaligned `this`, out-of-bounds shifts, and more.
  #                   -fno-sanitize-recover=undefined turns any violation into an
  #                   abort so the job fails instead of printing and passing.
  # ASan must be the first sanitizer runtime loaded, so the test step keeps the
  # libasan/libstdc++ LD_PRELOAD; the UBSan runtime is pulled in as a NEEDED
  # library of the extension and needs no preload.
  build_sdist:
    name: Build and test with sanitizers
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_LINKER_TYPE: MOLD
      CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: verify_asan_link_order=0
      UBSAN_OPTIONS: print_stacktrace=1
      SCCACHE_GHA_ENABLED: on
      ACTIONS_CACHE_SERVICE_V2: on
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: mozilla-actions/sccache-action@v0.0.10

    - run: pip install cmake ninja setuptools sccache

    # Download/install the build-independent test dependencies (all prebuilt
    # wheels) in the background so they fetch while the instrumented build below
    # compiles. The `wait` before the test step ensures they are ready first.
    - name: Install test dependencies
      id: test_deps
      background: true
      run: |
        pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu/
        pip install pytest flake8 onnxruntime onnxscript==0.6.2 timm==1.0.26 sympy

    - name: Build
      run: pip install --no-build-isolation -ve .

    - wait: test_deps

    - name: Test
      run: |
        LD_PRELOAD="/lib/x86_64-linux-gnu/libasan.so.8 /usr/lib/x86_64-linux-gnu/libstdc++.so.6" \
        LSAN_OPTIONS=suppressions=./scripts/leak.txt \
        pytest -sv tests
