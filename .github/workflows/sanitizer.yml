name: Build and Test with sanitizers

# This job's whole point is catching memory-safety/alignment bugs in onnxsim's
# C++ core (and the onnx/onnx-optimizer/protobuf tree it links), so restrict
# it to changes that can actually affect that: no point re-running an
# instrumented ~native build for a Python-only change.
on:
  push:
    branches:
      - main
      - master
    paths: &sanitizer-paths
      - "onnxsim/**"
      - "!onnxsim/**/*.py"
      - "CMakeLists.txt"
      - "cmake/**"
      - "third_party/**"
      - "setup.py"
      - "pyproject.toml"
      - ".gitmodules"
      - "scripts/leak.txt"
      - ".github/workflows/sanitizer.yml"
  pull_request:
    paths: *sanitizer-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A single instrumented build that runs AddressSanitizer and the alignment
  # UndefinedBehaviorSanitizer check together over the whole dependency tree
  # (onnxsim, onnx-optimizer, onnx, and its bundled protobuf):
  #   * address    -- use-after-free, heap/stack overflow, leaks (LSan).
  #   * alignment  -- misaligned typed loads/stores: the class of UB that x86_64
  #                   tolerates but that faults with SIGBUS on arm64, which is why
  #                   this sanitizer was added. -fno-sanitize-recover=alignment
  #                   turns any violation into an abort so the job fails instead
  #                   of printing and passing.
  #
  # We intentionally use the single `alignment` check rather than the full
  # `-fsanitize=undefined` set. The full set makes GCC wrongly reject a valid
  # constant expression in abseil's raw_hash_set (bundled transitively via
  # protobuf 6.x): "TypeErasedApplyToSlotFn<...> == 0 is not a constant
  # expression" in hash_policy_traits.h. That is a known GCC/abseil interaction
  # (GCC PR71962, abseil issue #1634), not onnxsim code we can change, and abseil
  # is a pinned dependency. `alignment` alone compiles the whole tree cleanly and
  # covers the misaligned-access UB this job exists for. To broaden UBSan back to
  # the full set, the fetched abseil/protobuf sources would have to be excluded
  # from instrumentation (e.g. -fsanitize-ignorelist) so the GCC bug is not hit.
  #
  # ASan must be the first sanitizer runtime loaded, so the test step keeps the
  # libasan/libstdc++ LD_PRELOAD; the UBSan runtime is pulled in as a NEEDED
  # library of the extension and needs no preload.
  build_sdist:
    name: Build and test with sanitizers
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_LINKER_TYPE: MOLD
      CXXFLAGS: -fsanitize=address,alignment -fno-sanitize-recover=alignment
      LDFLAGS: -fsanitize=address,alignment
      ASAN_OPTIONS: verify_asan_link_order=0
      UBSAN_OPTIONS: print_stacktrace=1
      SCCACHE_GHA_ENABLED: on
      ACTIONS_CACHE_SERVICE_V2: on
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: mozilla-actions/sccache-action@v0.0.11

    - run: pip install cmake ninja setuptools sccache nanobind

    # Download/install the build-independent test dependencies (all prebuilt
    # wheels) in the background so they fetch while the instrumented build below
    # compiles. The `wait` before the test step ensures they are ready first.
    - name: Install test dependencies
      id: test_deps
      background: true
      run: |
        pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu/
        pip install pytest flake8 onnxruntime onnxscript==0.6.2 timm==1.0.26 sympy

    - name: Build
      run: pip install --no-build-isolation -ve .

    - wait: test_deps

    - name: Test
      run: |
        LD_PRELOAD="/lib/x86_64-linux-gnu/libasan.so.8 /usr/lib/x86_64-linux-gnu/libstdc++.so.6" \
        LSAN_OPTIONS=suppressions=./scripts/leak.txt \
        pytest -sv tests
