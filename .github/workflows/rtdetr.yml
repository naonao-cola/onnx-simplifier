name: RT-DETR export test

# Builds onnxsim from source and runs tests/test_rtdetr.py, which exports
# tiny RT-DETR and RT-DETRv2 models (via Hugging Face transformers) with
# torch.onnx and simplifies them with onnxsim. This guards against onnxsim
# regressions on RT-DETR-family graphs -- see tests/test_rtdetr.py's own
# docstring, and tests/test_rtdetrv4.py for the RT-DETRv4 variant (no pip
# package, so it uses a hand-built onnx.parser graph instead).

# transformers pulls a large torch stack and this exports two models, so it
# is too heavy to run on every PR. Instead it runs on push to the default
# branch and once a day; use workflow_dispatch to trigger it manually against
# a branch when needed.
on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 8 * * *'  # daily at 08:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rtdetr:
    name: RT-DETR/RT-DETRv2 export -> onnxsim
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: 'on'
      ACTIONS_CACHE_SERVICE_V2: 'on'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build tooling
        run: pip install cmake ninja "setuptools>=77" sccache nanobind

      # The tiny RTDetr{,V2} configs in tests/test_rtdetr.py are built from
      # scratch (no from_pretrained call), so no Hugging Face Hub access is
      # needed at all -- just torch + transformers.
      - name: Install test dependencies
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu/
          pip install pytest onnxruntime transformers

      # Build the onnxsim under test last so it wins over anything a dependency
      # might have pulled. --no-build-isolation reuses the tooling installed above.
      - name: Build onnxsim (editable)
        run: pip install --no-build-isolation -ve .

      - name: Verify onnxsim under test is the source build
        run: python -c "import onnxsim, onnxsim.onnxsim_cpp2py_export; print('onnxsim', onnxsim.__version__, onnxsim.__file__)"

      - name: Run RT-DETR/RT-DETRv2 export test
        run: pytest -v tests/test_rtdetr.py
