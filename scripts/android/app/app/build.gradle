plugins {
    id "com.android.application"
}

android {
    namespace "org.onnxsim.androidtest"
    compileSdk 34
    ndkVersion project.findProperty("onnxsimNdkVersion") ?: "27.2.12479018"

    defaultConfig {
        applicationId "org.onnxsim.androidtest"
        minSdk 29
        targetSdk 28
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake { cppFlags "-std=c++17" }
        }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    buildTypes {
        debug { debuggable true }
    }

    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
}
