; Generic TFLite Micro runtime for M5Stack Cardputer (ESP32-S3).
;
; Built ONCE and flashed ONCE at 0x0 (this is the whole firmware image,
; bootloader+partitions+app merged the same way the firmware/README.md
; recipe does for a model-specific build). After that, swapping models
; never touches this firmware again: onnx-cardputer-flash's existing Web
; Serial flasher just writes a new .tflite's bytes to the "model"
; partition's fixed offset (see partitions.csv) -- no recompile, no
; PlatformIO, no C++ toolchain in that loop at all.
[env:cardputer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv
; Without this, Arduino's `Serial` (and Chirale_TensorFLowLite's internal
; DebugLog/MicroPrintf, which also write to `Serial`) default to UART0's
; physical GPIO pins -- not connected to anything on the Cardputer, which
; has no separate USB-UART chip and talks to the host only over the
; ESP32-S3's native USB-Serial/JTAG peripheral (the same port used for
; flashing). This makes `Serial` alias that peripheral instead, so prints
; actually reach the same port a host is already connected to.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Cardputer
    spaziochirale/Chirale_TensorFLowLite
